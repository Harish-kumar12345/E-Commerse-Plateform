services:
  # ==========================================================
  # 1. FASTIFY BACKEND API
  # ==========================================================
  - type: web
    name: nexus-api
    runtime: node
    plan: free
    buildCommand: npm install -g pnpm && pnpm install --frozen-lockfile && pnpm --filter @nexus/db db:generate && pnpm --filter @nexus/db db:push && pnpm turbo run build --filter=@nexus/api...
    startCommand: pnpm --filter @nexus/api start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: nexus-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: STOREFRONT_URL
        sync: false # Set to your deployed web URL (e.g. https://nexus-web.onrender.com)

  # ==========================================================
  # 2. NEXT.JS STOREFRONT
  # ==========================================================
  - type: web
    name: nexus-web
    runtime: node
    plan: free
    buildCommand: npm install -g pnpm && pnpm install --frozen-lockfile && pnpm turbo run build --filter=@nexus/web...
    startCommand: pnpm --filter @nexus/web start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        sync: false # Set to your deployed API URL with prefix (e.g. https://nexus-api.onrender.com/api/v1)

# ==========================================================
# 3. POSTGRESQL DATABASE
# ==========================================================
databases:
  - name: nexus-db
    plan: free
    databaseName: nexus_marketplace
    user: nexus_admin
